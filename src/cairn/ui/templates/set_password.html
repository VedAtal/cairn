{% extends "base.html" %}
{% block title %}Set password · Cairn{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>Set your password</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/ui/set-password" class="stack">
  <input type="hidden" name="token" value="{{ token }}">
  <label>Password <input type="password" name="password" autocomplete="new-password" minlength="10" required autofocus></label>
  <label>Confirm <input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>
  <button type="submit">Set password</button>
</form>
{% endblock %}
