[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "cairn"
version = "0.1.0"
description = "Cairn: a shared knowledge store for AI coding agents."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "snowballstemmer==3.1.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn>=0.32",
]

[project.scripts]
cairn = "cairn.cli.main:main"

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/cairn/db/migrations/versions/*" = ["E501"]  # generated by alembic

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["cairn"]

[[tool.mypy.overrides]]
module = ["snowballstemmer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
